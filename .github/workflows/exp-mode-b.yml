          	MANIFEST_EOF
          sha256sum "$RUNNER_TEMP/evidence/trace.d" | awk '{print $1}' > "$RUNNER_TEMP/evidence/trace.d.sha256"
          GO_VERSION="$(go version)" ARCH="$(uname -m)" python3 "$RUNNER_TEMP/evidence/manifest.py" "$EVIDENCE_DIR" "${{ github.run_id }}" "${{ github.run_attempt }}" "$ACTUAL_REV"
          sha256sum "$RUNNER_TEMP/evidence/trace.d" | awk '{print $1}' > "$RUNNER_TEMP/evidence/trace.d.sha256"
          (cd "$EVIDENCE_DIR" && sha256sum * > SHA256SUMS)
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ github.workflow }}-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: error

