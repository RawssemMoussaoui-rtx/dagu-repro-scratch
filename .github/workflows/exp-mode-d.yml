name: exp-mode-d

on:
  workflow_dispatch:
    inputs:
      execute_tests:
        description: 'Enable actual test execution'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  exp-d-pr-head:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Assert PR head SHA
        run: |
          EXPECTED="bc905d7a96efc3acc25ced36eb1b0aa90f1d1c59"
          echo "EXPECTED_REV=$EXPECTED" >> $GITHUB_ENV
      - name: Install Go 1.27.3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -f go1.27.3.darwin-arm64.tar.gz
          curl -fsSL -o go1.27.3.darwin-arm64.tar.gz https://go.dev/dl/go1.27.3.darwin-arm64.tar.gz
          echo "dd3908cf20959d798c1e06ebe5b72213f0505ce01373b40ce3110975a6cd99c2  go1.27.3.darwin-arm64.tar.gz" | shasum -a 256 -c -
          tar -xzf go1.27.3.darwin-arm64.tar.gz
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          echo "$RUNNER_TEMP/go/bin" >> $GITHUB_PATH
          go version
      - name: Clone dagu at PR head (canonical base repo, detached)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dagu
          git clone https://github.com/dagucloud/dagu.git dagu
          cd dagu
          git fetch origin refs/pull/3156/head
          git checkout --detach FETCH_HEAD
          ACTUAL=$(git rev-parse HEAD)
          if [ ${#ACTUAL} -ne 40 ]; then echo "FAIL: not a full 40-character SHA: $ACTUAL"; exit 1; fi
          echo "ACTUAL_REV=$ACTUAL" >> $GITHUB_ENV
          if [ "$ACTUAL" != "$EXPECTED_REV" ]; then echo "SHA_MISMATCH expected=$EXPECTED_REV actual=$ACTUAL"; exit 1; fi
          echo "SHA_ASSERT_OK: $ACTUAL"
      - name: Compile Dagu test binary (PR head)
        if: ${{ inputs.execute_tests }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          cd "$RUNNER_TEMP/dagu"
          go test -c -o "$RUNNER_TEMP/dagu.test" "./internal/service/frontend/api/v1"
      - name: DTrace-traced test execution (PR head, N runs)
        if: ${{ inputs.execute_tests }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          cd "$RUNNER_TEMP/dagu"
          PKG="./internal/service/frontend/api/v1"
          N=10
          FAIL_COUNT=0
          for i in $(seq 1 $N); do
            dtrace_out="$RUNNER_TEMP/dtrace_prhead_D_$i.txt"
            set +e
            sudo dtrace -n '
            syscall::openat:entry { self->dirfd[tid] = arg0; self->path[tid] = copyinstr(arg1, 256); }
            syscall::openat:return /self->path[tid] != 0/ {
              self->is_basetmp[tid] = (index(self->path[tid], "base.yaml.tmp.") != 0);
              printf("OPENAT pid=%d tid=%d dirfd=%d path=%s fd=%d retval=%d is_basetmp=%d ts=%llu\n", pid, tid, self->dirfd[tid], self->path[tid], arg0, arg0, self->is_basetmp[tid], timestamp);
              self->path[tid] = 0; self->dirfd[tid] = 0; self->is_basetmp[tid] = 0;
            }
            syscall::open:entry { self->path[tid] = copyinstr(arg0, 256); }
            syscall::open:return /self->path[tid] != 0/ {
              self->is_basetmp[tid] = (index(self->path[tid], "base.yaml.tmp.") != 0);
              printf("OPEN pid=%d tid=%d path=%s fd=%d retval=%d is_basetmp=%d ts=%llu\n", pid, tid, self->path[tid], arg0, arg0, self->is_basetmp[tid], timestamp);
              self->path[tid] = 0; self->is_basetmp[tid] = 0;
            }
            syscall::dup:entry { self->srcfd[tid] = arg0; }
            syscall::dup:return /self->srcfd[tid] != 0/ { printf("DUP pid=%d tid=%d srcfd=%d newfd=%d retval=%d ts=%llu\n", pid, tid, self->srcfd[tid], arg0, arg0, timestamp); self->srcfd[tid] = 0; }
            syscall::dup2:entry { self->srcfd[tid] = arg0; self->newfd[tid] = arg1; }
            syscall::dup2:return /self->srcfd[tid] != 0/ { printf("DUP2 pid=%d tid=%d srcfd=%d newfd=%d retval=%d ts=%llu\n", pid, tid, self->srcfd[tid], self->newfd[tid], arg0, timestamp); self->srcfd[tid] = 0; self->newfd[tid] = 0; }
            syscall::fcntl:entry { self->fd[tid] = arg0; self->cmd[tid] = arg1; self->farg[tid] = arg2; }
            syscall::fcntl:return /self->fd[tid] != 0/ { printf("FCNTL pid=%d tid=%d fd=%d cmd=%d farg=%d retval=%d ts=%llu\n", pid, tid, self->fd[tid], self->cmd[tid], self->farg[tid], arg0, timestamp); self->fd[tid] = 0; self->cmd[tid] = 0; self->farg[tid] = 0; }
            syscall::close:entry { self->fd[tid] = arg0; printf("CLOSE_ENTRY pid=%d tid=%d fd=%d ts=%llu\n", pid, tid, arg0, timestamp); }
            syscall::close:return /self->fd[tid] != 0/ { printf("CLOSE_RETURN pid=%d tid=%d fd=%d retval=%d ts=%llu\n", pid, tid, self->fd[tid], arg0, timestamp); self->fd[tid] = 0; }
            ' -c "sh -c '$RUNNER_TEMP/dagu.test -test.run TestAPIKeys_DeleteNotFound'" > "$dtrace_out" 2>&1
            RC=$?
            set -e
            if [ $RC -ne 0 ]; then echo "RUN $i FAIL D dtrace_rc=$RC"; FAIL_COUNT=$((FAIL_COUNT+1)); else echo "RUN $i PASS D"; fi
          done
          echo "COMPLETED_INVOCATIONS=$N" >> $GITHUB_ENV
          echo "FAIL_COUNT=$FAIL_COUNT" >> $GITHUB_ENV
          test "$FAIL_COUNT" -eq 0 || { echo "FAIL: $FAIL_COUNT invocation(s) failed"; exit 1; }

  exp-d-main:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Assert main baseline SHA
        run: |
          EXPECTED="42b0bc8f0fdeea68c0d9cee83f0e11a07c252b58"
          echo "EXPECTED_REV=$EXPECTED" >> $GITHUB_ENV
      - name: Install Go 1.27.3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -f go1.27.3.darwin-arm64.tar.gz
          curl -fsSL -o go1.27.3.darwin-arm64.tar.gz https://go.dev/dl/go1.27.3.darwin-arm64.tar.gz
          echo "dd3908cf20959d798c1e06ebe5b72213f0505ce01373b40ce3110975a6cd99c2  go1.27.3.darwin-arm64.tar.gz" | shasum -a 256 -c -
          tar -xzf go1.27.3.darwin-arm64.tar.gz
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          echo "$RUNNER_TEMP/go/bin" >> $GITHUB_PATH
          go version
      - name: Clone dagu at main baseline (canonical base repo, detached)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dagu
          git clone https://github.com/dagucloud/dagu.git dagu
          cd dagu
          git checkout --detach "$EXPECTED_REV"
          ACTUAL=$(git rev-parse HEAD)
          if [ ${#ACTUAL} -ne 40 ]; then echo "FAIL: not a full 40-character SHA: $ACTUAL"; exit 1; fi
          echo "ACTUAL_REV=$ACTUAL" >> $GITHUB_ENV
          if [ "$ACTUAL" != "$EXPECTED_REV" ]; then echo "SHA_MISMATCH expected=$EXPECTED_REV actual=$ACTUAL"; exit 1; fi
          echo "SHA_ASSERT_OK: $ACTUAL"
      - name: Compile Dagu test binary (main baseline)
        if: ${{ inputs.execute_tests }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          cd "$RUNNER_TEMP/dagu"
          go test -c -o "$RUNNER_TEMP/dagu.test" "./internal/service/frontend/api/v1"
      - name: DTrace-traced test execution (main baseline, N runs)
        if: ${{ inputs.execute_tests }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          cd "$RUNNER_TEMP/dagu"
          PKG="./internal/service/frontend/api/v1"
          N=10
          FAIL_COUNT=0
          for i in $(seq 1 $N); do
            dtrace_out="$RUNNER_TEMP/dtrace_main_D_$i.txt"
            set +e
            sudo dtrace -n '
            syscall::openat:entry { self->dirfd[tid] = arg0; self->path[tid] = copyinstr(arg1, 256); }
            syscall::openat:return /self->path[tid] != 0/ {
              self->is_basetmp[tid] = (index(self->path[tid], "base.yaml.tmp.") != 0);
              printf("OPENAT pid=%d tid=%d dirfd=%d path=%s fd=%d retval=%d is_basetmp=%d ts=%llu\n", pid, tid, self->dirfd[tid], self->path[tid], arg0, arg0, self->is_basetmp[tid], timestamp);
              self->path[tid] = 0; self->dirfd[tid] = 0; self->is_basetmp[tid] = 0;
            }
            syscall::open:entry { self->path[tid] = copyinstr(arg0, 256); }
            syscall::open:return /self->path[tid] != 0/ {
              self->is_basetmp[tid] = (index(self->path[tid], "base.yaml.tmp.") != 0);
              printf("OPEN pid=%d tid=%d path=%s fd=%d retval=%d is_basetmp=%d ts=%llu\n", pid, tid, self->path[tid], arg0, arg0, self->is_basetmp[tid], timestamp);
              self->path[tid] = 0; self->is_basetmp[tid] = 0;
            }
            syscall::dup:entry { self->srcfd[tid] = arg0; }
            syscall::dup:return /self->srcfd[tid] != 0/ { printf("DUP pid=%d tid=%d srcfd=%d newfd=%d retval=%d ts=%llu\n", pid, tid, self->srcfd[tid], arg0, arg0, timestamp); self->srcfd[tid] = 0; }
            syscall::dup2:entry { self->srcfd[tid] = arg0; self->newfd[tid] = arg1; }
            syscall::dup2:return /self->srcfd[tid] != 0/ { printf("DUP2 pid=%d tid=%d srcfd=%d newfd=%d retval=%d ts=%llu\n", pid, tid, self->srcfd[tid], self->newfd[tid], arg0, timestamp); self->srcfd[tid] = 0; self->newfd[tid] = 0; }
            syscall::fcntl:entry { self->fd[tid] = arg0; self->cmd[tid] = arg1; self->farg[tid] = arg2; }
            syscall::fcntl:return /self->fd[tid] != 0/ { printf("FCNTL pid=%d tid=%d fd=%d cmd=%d farg=%d retval=%d ts=%llu\n", pid, tid, self->fd[tid], self->cmd[tid], self->farg[tid], arg0, timestamp); self->fd[tid] = 0; self->cmd[tid] = 0; self->farg[tid] = 0; }
            syscall::close:entry { self->fd[tid] = arg0; printf("CLOSE_ENTRY pid=%d tid=%d fd=%d ts=%llu\n", pid, tid, arg0, timestamp); }
            syscall::close:return /self->fd[tid] != 0/ { printf("CLOSE_RETURN pid=%d tid=%d fd=%d retval=%d ts=%llu\n", pid, tid, self->fd[tid], arg0, timestamp); self->fd[tid] = 0; }
            ' -c "sh -c '$RUNNER_TEMP/dagu.test -test.run TestAPIKeys_DeleteNotFound'" > "$dtrace_out" 2>&1
            RC=$?
            set -e
            if [ $RC -ne 0 ]; then echo "RUN $i FAIL D dtrace_rc=$RC"; FAIL_COUNT=$((FAIL_COUNT+1)); else echo "RUN $i PASS D"; fi
          done
          echo "COMPLETED_INVOCATIONS=$N" >> $GITHUB_ENV
          echo "FAIL_COUNT=$FAIL_COUNT" >> $GITHUB_ENV
          test "$FAIL_COUNT" -eq 0 || { echo "FAIL: $FAIL_COUNT invocation(s) failed"; exit 1; }