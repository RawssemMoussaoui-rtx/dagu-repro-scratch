name: exp-mode-a

on:
  workflow_dispatch:
    inputs:
      execute_tests:
        description: 'Enable actual test execution'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  exp-a-pr-head:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Assert PR head SHA
        run: |
          EXPECTED="bc905d7a96efc3acc25ced36eb1b0aa90f1d1c59"
          echo "EXPECTED_REV=$EXPECTED" >> $GITHUB_ENV
      - name: Install Go 1.27.3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -f go1.27.3.darwin-arm64.tar.gz
          curl -fsSL -o go1.27.3.darwin-arm64.tar.gz https://go.dev/dl/go1.27.3.darwin-arm64.tar.gz
          echo "dd3908cf20959d798c1e06ebe5b72213f0505ce01373b40ce3110975a6cd99c2  go1.27.3.darwin-arm64.tar.gz" | shasum -a 256 -c -
          tar -xzf go1.27.3.darwin-arm64.tar.gz
          echo "$RUNNER_TEMP/go/bin" >> $GITHUB_PATH
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          go version
      - name: Clone dagu at PR head (canonical base repo, detached)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dagu
          git clone https://github.com/dagucloud/dagu.git dagu
          cd dagu
          git fetch origin refs/pull/3156/head
          git checkout --detach FETCH_HEAD
          ACTUAL=$(git rev-parse HEAD)
          if [ ${#ACTUAL} -ne 40 ]; then echo "FAIL: not a full 40-character SHA: $ACTUAL"; exit 1; fi
          echo "ACTUAL_REV=$ACTUAL" >> $GITHUB_ENV
          if [ "$ACTUAL" != "$EXPECTED_REV" ]; then echo "SHA_MISMATCH expected=$EXPECTED_REV actual=$ACTUAL"; exit 1; fi
          echo "SHA_ASSERT_OK: $ACTUAL"
      - name: Compile Dagu test binary (PR head)
        if: ${{ inputs.execute_tests }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          cd "$RUNNER_TEMP/dagu"
          go test -c -o "$RUNNER_TEMP/dagu.test" "./internal/service/frontend/api/v1"
      - name: DTrace-traced test execution (PR head, N runs)
        if: ${{ inputs.execute_tests }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          cd "$RUNNER_TEMP/dagu"
          PKG="./internal/service/frontend/api/v1"
          N=5
          FAIL_COUNT=0
          for i in $(seq 1 $N); do
            dtrace_out="$RUNNER_TEMP/dtrace_prhead_A_$i.txt"
            set +e
            sudo dtrace -n '
            syscall::openat:entry /execname == "dagu.test"/ { self->dirfd = arg0; self->path = copyinstr(arg1, 256); }
            syscall::openat:return /execname == "dagu.test"/ { printf("OPENAT pid=%d tid=%d dirfd=%d path=%s fd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->dirfd, self->path, arg0, arg0, errno, timestamp); self->dirfd = 0; self->path = 0; }
            syscall::open:entry /execname == "dagu.test"/ { self->path = copyinstr(arg0, 256); }
            syscall::open:return /execname == "dagu.test"/ { printf("OPEN pid=%d tid=%d path=%s fd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->path, arg0, arg0, errno, timestamp); self->path = 0; }
            syscall::close:entry /execname == "dagu.test"/ { self->fd = arg0; }
            syscall::close:return /execname == "dagu.test"/ { printf("CLOSE pid=%d tid=%d fd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->fd, arg0, errno, timestamp); self->fd = 0; }
            syscall::dup:entry /execname == "dagu.test"/ { self->fd = arg0; }
            syscall::dup:return /execname == "dagu.test"/ { printf("DUP pid=%d tid=%d srcfd=%d newfd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->fd, arg0, arg0, errno, timestamp); self->fd = 0; }
            syscall::dup2:entry /execname == "dagu.test"/ { self->srcfd = arg0; self->dstfd = arg1; }
            syscall::dup2:return /execname == "dagu.test"/ { printf("DUP2 pid=%d tid=%d srcfd=%d dstfd=%d newfd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->srcfd, self->dstfd, arg0, arg0, errno, timestamp); self->srcfd = 0; self->dstfd = 0; }
            syscall::fcntl:entry /execname == "dagu.test"/ { self->fd = arg0; self->cmd = arg1; self->arg = arg2; }
            syscall::fcntl:return /execname == "dagu.test"/ { printf("FCNTL pid=%d tid=%d fd=%d cmd=%d farg=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->fd, self->cmd, self->arg, arg0, errno, timestamp); self->fd = 0; self->cmd = 0; self->arg = 0; }
            ' -c "sh -c '$RUNNER_TEMP/dagu.test -test.run TestAPIKeys_DeleteNotFound'" > "$dtrace_out" 2>&1
            RC=$?
            set -e
            if [ $RC -ne 0 ]; then echo "RUN $i FAIL A dtrace_rc=$RC"; FAIL_COUNT=$((FAIL_COUNT+1)); else echo "RUN $i PASS A"; fi
          done
          echo "COMPLETED_INVOCATIONS=$N" >> $GITHUB_ENV
          echo "FAIL_COUNT=$FAIL_COUNT" >> $GITHUB_ENV
          test "$FAIL_COUNT" -eq 0 || { echo "FAIL: $FAIL_COUNT invocation(s) failed"; exit 1; }

  exp-a-main:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Assert main baseline SHA
        run: |
          EXPECTED="42b0bc8f0fdeea68c0d9cee83f0e11a07c252b58"
          echo "EXPECTED_REV=$EXPECTED" >> $GITHUB_ENV
      - name: Install Go 1.27.3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -f go1.27.3.darwin-arm64.tar.gz
          curl -fsSL -o go1.27.3.darwin-arm64.tar.gz https://go.dev/dl/go1.27.3.darwin-arm64.tar.gz
          echo "dd3908cf20959d798c1e06ebe5b72213f0505ce01373b40ce3110975a6cd99c2  go1.27.3.darwin-arm64.tar.gz" | shasum -a 256 -c -
          tar -xzf go1.27.3.darwin-arm64.tar.gz
          echo "$RUNNER_TEMP/go/bin" >> $GITHUB_PATH
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          go version
      - name: Clone dagu at main baseline (canonical base repo, detached)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          rm -rf dagu
          git clone https://github.com/dagucloud/dagu.git dagu
          cd dagu
          git checkout --detach "$EXPECTED_REV"
          ACTUAL=$(git rev-parse HEAD)
          if [ ${#ACTUAL} -ne 40 ]; then echo "FAIL: not a full 40-character SHA: $ACTUAL"; exit 1; fi
          echo "ACTUAL_REV=$ACTUAL" >> $GITHUB_ENV
          if [ "$ACTUAL" != "$EXPECTED_REV" ]; then echo "SHA_MISMATCH expected=$EXPECTED_REV actual=$ACTUAL"; exit 1; fi
          echo "SHA_ASSERT_OK: $ACTUAL"
      - name: Compile Dagu test binary (main baseline)
        if: ${{ inputs.execute_tests }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          cd "$RUNNER_TEMP/dagu"
          go test -c -o "$RUNNER_TEMP/dagu.test" "./internal/service/frontend/api/v1"
      - name: DTrace-traced test execution (main baseline, N runs)
        if: ${{ inputs.execute_tests }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/go/bin:$PATH"
          cd "$RUNNER_TEMP/dagu"
          PKG="./internal/service/frontend/api/v1"
          N=5
          FAIL_COUNT=0
          for i in $(seq 1 $N); do
            dtrace_out="$RUNNER_TEMP/dtrace_main_A_$i.txt"
            set +e
            sudo dtrace -n '
            syscall::openat:entry /execname == "dagu.test"/ { self->dirfd = arg0; self->path = copyinstr(arg1, 256); }
            syscall::openat:return /execname == "dagu.test"/ { printf("OPENAT pid=%d tid=%d dirfd=%d path=%s fd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->dirfd, self->path, arg0, arg0, errno, timestamp); self->dirfd = 0; self->path = 0; }
            syscall::open:entry /execname == "dagu.test"/ { self->path = copyinstr(arg0, 256); }
            syscall::open:return /execname == "dagu.test"/ { printf("OPEN pid=%d tid=%d path=%s fd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->path, arg0, arg0, errno, timestamp); self->path = 0; }
            syscall::close:entry /execname == "dagu.test"/ { self->fd = arg0; }
            syscall::close:return /execname == "dagu.test"/ { printf("CLOSE pid=%d tid=%d fd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->fd, arg0, errno, timestamp); self->fd = 0; }
            syscall::dup:entry /execname == "dagu.test"/ { self->fd = arg0; }
            syscall::dup:return /execname == "dagu.test"/ { printf("DUP pid=%d tid=%d srcfd=%d newfd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->fd, arg0, arg0, errno, timestamp); self->fd = 0; }
            syscall::dup2:entry /execname == "dagu.test"/ { self->srcfd = arg0; self->dstfd = arg1; }
            syscall::dup2:return /execname == "dagu.test"/ { printf("DUP2 pid=%d tid=%d srcfd=%d dstfd=%d newfd=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->srcfd, self->dstfd, arg0, arg0, errno, timestamp); self->srcfd = 0; self->dstfd = 0; }
            syscall::fcntl:entry /execname == "dagu.test"/ { self->fd = arg0; self->cmd = arg1; self->arg = arg2; }
            syscall::fcntl:return /execname == "dagu.test"/ { printf("FCNTL pid=%d tid=%d fd=%d cmd=%d farg=%d retval=%d errno=%d ts=%llu\n", pid, tid, self->fd, self->cmd, self->arg, arg0, errno, timestamp); self->fd = 0; self->cmd = 0; self->arg = 0; }
            ' -c "sh -c '$RUNNER_TEMP/dagu.test -test.run TestAPIKeys_DeleteNotFound'" > "$dtrace_out" 2>&1
            RC=$?
            set -e
            if [ $RC -ne 0 ]; then echo "RUN $i FAIL A dtrace_rc=$RC"; FAIL_COUNT=$((FAIL_COUNT+1)); else echo "RUN $i PASS A"; fi
          done
          echo "COMPLETED_INVOCATIONS=$N" >> $GITHUB_ENV
          echo "FAIL_COUNT=$FAIL_COUNT" >> $GITHUB_ENV
          test "$FAIL_COUNT" -eq 0 || { echo "FAIL: $FAIL_COUNT invocation(s) failed"; exit 1; }
